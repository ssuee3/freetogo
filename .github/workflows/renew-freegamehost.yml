# FreeGameHost 自动续期工作流
name: Auto Renew FreeGameHost

on:
  workflow_dispatch:
  schedule:
    # 每 3 小时（UTC 整点：0/3/6/9/12/15/18/21，北京时间 8/11/14/17/20/23/2/5）
    - cron: '14 */3 * * *'

jobs:
  renew-freegamehost:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Setup Chrome & Xvfb
        run: |
          google-chrome --version || (sudo apt-get update && sudo apt-get install -y google-chrome-stable)
          sudo apt-get install -y xvfb

      # 注意：这里不再忽略失败。代理起不来时续期必然带着死代理失败，
      # 直接在这一步报错比后面报 ERR_PROXY_CONNECTION_FAILED 好排查。
      - name: ⚙ 设置代理 (sing-box)
        env:
          NODE_LINK: ${{ secrets.NODE_LINK }}
        run: bash setup_proxy.sh

      - name: Run renewal script
        env:
          EMAIL: ${{ secrets.EMAIL }}
          PASSWORD: ${{ secrets.PASSWORD }}
          SESSION_COOKIES: ${{ secrets.SESSION_COOKIES }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          # 浏览器时区必须与代理出口地区一致：本节点是美国 IP，故用美西时区。
          # 若不匹配（如美国节点配 Asia/Shanghai），时区本身就构成机器人信号。
          # 换节点后记得同步改这里；留空则不设（回落 runner 的 UTC）。
          BROWSER_TZ: 'America/Los_Angeles'
          # 内置点击器关闭：它每秒去点一个 290~310px 的 div，对 compact 控件无效且会干扰
          TURNSTILE_LIB_SOLVER: 'false'
          # 不设 TURNSTILE_NO_CLICK：脚本会先安静等 45s（本节点实测 10s 就自动过，快路径不受影响），
          # 若超时才点一次作为兜底。若设为 'true' 则永不点击，遇到需要交互的节点只能干等到超时。
          # 总预算 300s：足够覆盖「45s 纯等 → 点击 → 60s 再等 → reset → 重开控件」的完整流程
          TURNSTILE_WAIT_S: '300'
        # 屏幕必须比浏览器窗口（默认 1366x900）大，否则 innerWidth > screen.width，
        # 这是真实浏览器不可能出现的几何关系，属于明显的自动化特征。
        run: |
          xvfb-run -a -s "-screen 0 1920x1080x24" node renew-freegamehost.js

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: renewal-freegamehost-artifacts
          path: artifacts/
          if-no-files-found: ignore

      - name: 🧽 清理进程和临时文件
        if: always()
        run: |
          pkill -f sing-box || true
          pkill -f chromedriver || true
          pkill -f chrome || true
          pkill -f Xvfb || true
          rm -f sing-box sing-box-config.json sing-box.log

      - name: 🧹 清理旧的工作流运行记录
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runs=$(gh run list --workflow="${{ github.workflow }}" --limit=100 --json databaseId --jq '.[].databaseId')
          count=0
          for run_id in $runs; do
            count=$((count + 1))
            if [ $count -gt 1 ]; then
              echo "删除运行记录: $run_id"
              gh run delete $run_id || true
            fi
          done
